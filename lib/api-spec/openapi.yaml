openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mission-control
    description: Mission Control page-builder pipeline
  - name: prompts
    description: Prompt manager operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mc/runs:
    get:
      operationId: listRuns
      tags:
        - mission-control
      summary: List all build runs
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionRun"
    post:
      operationId: createRun
      tags:
        - mission-control
      summary: Create a new build run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
  /mc/summary:
    get:
      operationId: getSummary
      tags:
        - mission-control
      summary: Dashboard summary (counts and recent activity)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /mc/seo-intel:
    get:
      operationId: getSeoIntel
      tags:
        - mission-control
      summary: Live SEO intel derived from a target URL
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Derived run inputs (city/state, classification, competition, SEO intel)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivedRunInputs"
        "400":
          description: Bad or unparseable URL, or SEO provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/registry:
    get:
      operationId: getRegistry
      tags:
        - mission-control
      summary: The locked URL/image/link safeguard registry
      responses:
        "200":
          description: Registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryInfo"
  /mc/runs/{id}:
    get:
      operationId: getRun
      tags:
        - mission-control
      summary: Get a single run with full state
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRun
      tags:
        - mission-control
      summary: Delete a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "204":
          description: Deleted
  /mc/runs/{id}/phases/{phase}/run:
    post:
      operationId: runPhase
      tags:
        - mission-control
      summary: Execute a pipeline phase
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PhaseName"
      responses:
        "200":
          description: Phase executed; updated run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
        "400":
          description: Phase could not run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/runs/{id}/phases/{phase}/replit:
    post:
      operationId: runReplitPhase
      tags:
        - mission-control
      summary: Submit an operator/Agent-produced artifact and execute the phase (Replit mode)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PhaseName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplitPhaseInput"
      responses:
        "200":
          description: Phase executed against the submitted artifact; updated run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
        "400":
          description: Phase could not run or required artifact missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/runs/{id}/phases/{phase}/prompt:
    get:
      operationId: getPhasePrompt
      tags:
        - mission-control
      summary: Get the copy-paste prompt text for a Replit-mode phase
      description: Returns the exact per-phase prompt (the same text Dashboard mode sends to a model) so a VA can copy it into the Replit Agent. Only build, audit, and schema have prompts; the response flags whether the GMB or No-GMB variant was emitted.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PhaseName"
      responses:
        "200":
          description: The assembled prompt text for the phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhasePrompt"
        "400":
          description: The phase has no copy-paste prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/runs/{id}/phases/{phase}/approve:
    post:
      operationId: approvePhase
      tags:
        - mission-control
      summary: Approve a completed phase and unlock the next
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PhaseName"
      responses:
        "200":
          description: Updated run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
  /mc/runs/{id}/check:
    post:
      operationId: runCheckers
      tags:
        - mission-control
      summary: Run the checker suite against the current page HTML
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Checker report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckerReport"
  /mc/runs/{id}/link-audit/override:
    post:
      operationId: overrideLinkAudit
      tags:
        - mission-control
      summary: Record a human override of a failing link audit so publish can proceed
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAuditOverrideRequest"
      responses:
        "200":
          description: Updated run with the recorded override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
    delete:
      operationId: revokeLinkAuditOverride
      tags:
        - mission-control
      summary: Revoke a previously recorded link-audit override
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Updated run with the override cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionRun"
  /mc/runs/{id}/qc:
    get:
      operationId: getQcResults
      tags:
        - mission-control
      summary: List post-publish QC results for a run (most recent first)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: QC result history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QcResultRecord"
    post:
      operationId: runQc
      tags:
        - mission-control
      summary: Run the post-publish QC suite (GTmetrix speed + JSON-LD scan) against the live URL
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcRunInput"
      responses:
        "200":
          description: QC result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcResultRecord"
        "400":
          description: Could not determine a live URL to QC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/runs/{id}/html:
    put:
      operationId: saveRunHtml
      tags:
        - mission-control
      summary: Save a manual, deterministic edit of the page HTML (no AI) and re-run checkers
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveHtmlInput"
      responses:
        "200":
          description: Edit result with the refreshed checker report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatEditResult"
        "400":
          description: Invalid HTML payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/runs/{id}/chat:
    get:
      operationId: getChatHistory
      tags:
        - mission-control
      summary: Get the AI edit chat history for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: chatEdit
      tags:
        - mission-control
      summary: Request a surgical AI edit to the page via chat
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Edit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatEditResult"
  /mc/work-log:
    get:
      operationId: listWorkLog
      tags:
        - mission-control
      summary: List the canonical work-log (every page/blog, all sources)
      description: Returns every work-log row with its latest SEO snapshot delta embedded. Optional filters narrow by company, VA, status, type, and month.
      parameters:
        - name: company
          in: query
          required: false
          schema:
            type: string
        - name: vaName
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: pageType
          in: query
          required: false
          schema:
            type: string
        - name: month
          in: query
          required: false
          description: Filter by completion month, format YYYY-MM.
          schema:
            type: string
      responses:
        "200":
          description: Work-log rows (with embedded SEO delta)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkLogRecord"
    post:
      operationId: upsertWorkLog
      tags:
        - mission-control
      summary: Upsert a work-log record (natural-keyed by normalized URL)
      description: "Idempotent on the normalized URL: re-logging the same page updates the existing row instead of creating a duplicate. Used by the old static VA tools and Mission Control alike."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkLogInput"
      responses:
        "200":
          description: The upserted work-log row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLogRecord"
        "400":
          description: Invalid input (e.g. missing/unusable URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/work-log/{id}/snapshots:
    get:
      operationId: getWorkLogSnapshots
      tags:
        - mission-control
      summary: List the dated SEO snapshots for a work-log page (newest first)
      parameters:
        - $ref: "#/components/parameters/WorkLogId"
      responses:
        "200":
          description: Snapshot history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeoSnapshot"
  /mc/work-log/import:
    post:
      operationId: importWorkLog
      tags:
        - mission-control
      summary: One-time historical import of legacy master-list rows
      description: Ingests an array of messy legacy rows, maps them to the canonical schema, de-duplicates by normalized URL (upsert), and flags rows that cannot be cleanly mapped for manual review rather than dropping them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkLogImportInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLogImportResult"
  /mc/sitemap-reconcile:
    get:
      operationId: reconcileSitemap
      tags:
        - mission-control
      summary: Reconcile the work-log against the live production sitemap
      description: Fetches the live sitemap.xml, compares it against the work-log, and returns per-page status (live / tracked-but-not-live / live-but-untracked) plus a summary. Optionally persists the in-sitemap flag onto each row.
      parameters:
        - name: persist
          in: query
          required: false
          description: When true, write the in-sitemap flag back onto each work-log row.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapReconciliation"
        "400":
          description: Could not fetch or parse the sitemap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/sheets/sync:
    post:
      operationId: syncSheets
      tags:
        - mission-control
      summary: Push the work-log out to the fresh Google Sheet (one-way mirror)
      description: Overwrites the standardized tabs (Pages, Blogs, Sitemap Status, By VA, Monthly) on the configured Google Sheet from the canonical work-log. The app is the source of truth; the sheet is a read-mirror. Fails loudly when the Google Sheets connection or target sheet is not configured.
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetsSyncResult"
        "400":
          description: Google Sheets not configured or sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mc/gsc/pull:
    post:
      operationId: pullSearchConsole
      tags:
        - mission-control
      summary: Pull dated SEO snapshots from Google Search Console for tracked pages
      description: "Runs the internal Search Console pull (also invoked by the monthly scheduled job): records a dated snapshot per tracked page (top keyword positions, impressions, clicks, avg position). Fails loudly when GSC credentials are not configured."
      responses:
        "200":
          description: Pull result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GscPullResult"
        "400":
          description: Search Console not configured or pull failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /prompts:
    get:
      operationId: listPrompts
      tags:
        - prompts
      summary: List prompts
      description: List all prompts, optionally filtered by brand. Returns public fields only.
      parameters:
        - name: brand
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Brand"
      responses:
        "200":
          description: List of prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
  /prompts/{id}:
    get:
      operationId: getPrompt
      tags:
        - prompts
      summary: Get a prompt
      description: Get a single prompt with its full content by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updatePrompt
      tags:
        - prompts
      summary: Update a prompt (admin)
      description: Update a prompt's content. Requires admin bearer token. Saves to the DB only; does not publish.
      security:
        - adminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptRequest"
      responses:
        "200":
          description: The updated prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /prompts/{id}/publish:
    post:
      operationId: publishPrompt
      tags:
        - prompts
      summary: Publish a prompt (admin)
      description: |
        Persist the prompt content to the DB, then write it to Google Drive. The Drive target reports its own success/failure status. Requires admin bearer token.
      security:
        - adminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPromptRequest"
      responses:
        "200":
          description: Publish result with per-target status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mc/meta-research:
    post:
      operationId: researchMeta
      tags:
        - mission-control
      summary: Research-backed best-of-the-best meta for a single page
      description: Live-fetches the target URL, detects the actual niche from the page content (not the URL slug), pulls the live SERP for that niche + city, and synthesizes the winning title/description/keywords.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaResearchRequest"
      responses:
        "200":
          description: Researched meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResearchResult"
        "400":
          description: Bad URL, missing config, or research failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PhaseName:
      name: phase
      in: path
      required: true
      schema:
        type: string
        enum:
          - research
          - build
          - audit
          - schema
          - publish
    WorkLogId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    MetaResearchRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          description: Full http(s) URL of the page being rebuilt.
        county:
          type: string
          nullable: true
          description: Optional county; enables the "free pickup" line in the description.
    MetaCompetitor:
      type: object
      required:
        - title
        - link
        - position
      properties:
        title:
          type: string
        link:
          type: string
        position:
          type: integer
          nullable: true
    MetaResearchResult:
      type: object
      required:
        - url
        - city
        - state
        - stateName
        - county
        - detectedNiche
        - services
        - nicheConfidence
        - nicheReasoning
        - browserPageTitle
        - metaDescription
        - keywords
        - keywordList
        - rationale
        - competitors
        - peopleAlsoAsk
        - relatedKeywords
        - competition
        - locationVerified
        - locationSource
        - sources
        - fetchedAt
      properties:
        url:
          type: string
        city:
          type: string
        state:
          type: string
        stateName:
          type: string
        county:
          type: string
          nullable: true
        detectedNiche:
          type: string
        services:
          type: array
          items:
            type: string
        nicheConfidence:
          type: string
          enum:
            - high
            - medium
            - low
        nicheReasoning:
          type: string
        browserPageTitle:
          type: string
        metaDescription:
          type: string
        keywords:
          type: string
        keywordList:
          type: array
          items:
            type: string
        rationale:
          type: string
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/MetaCompetitor"
        peopleAlsoAsk:
          type: array
          items:
            type: string
        relatedKeywords:
          type: array
          items:
            type: string
        competition:
          type: string
        locationVerified:
          type: boolean
        locationSource:
          type: string
          enum:
            - url
            - page
        sources:
          type: array
          items:
            type: string
        fetchedAt:
          type: string
    RunInput:
      type: object
      description: Simplified New Build form. The VA supplies who they are (vaName) and the target page URL; the server derives city/state, classification, competition and live SEO intel from the URL.
      required:
        - vaName
        - url
      properties:
        vaName:
          type: string
          minLength: 1
          description: Name of the VA creating this run (tracked in the DB).
        url:
          type: string
          minLength: 1
          description: Target page URL; city/state and SEO data are derived from it.
        track:
          type: string
          enum:
            - page
            - blog
          default: page
        engine:
          type: string
          enum:
            - claude
            - openai
            - gemini
            - replit
          default: claude
        pageType:
          type: string
          enum:
            - HUB
            - SPOKE
            - NATIONAL
          default: SPOKE
        existingUrls:
          type: array
          items:
            type: string
        handoff:
          type:
            - string
            - "null"
        verifiedCid:
          type:
            - string
            - "null"
        designBibleHash:
          type:
            - string
            - "null"
        blogTopic:
          type:
            - string
            - "null"
    ChatInput:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
    SaveHtmlInput:
      type: object
      required:
        - html
      properties:
        html:
          type: string
          minLength: 1
    ReplitPhaseInput:
      type: object
      description: Operator/Agent-produced artifact for a Replit-mode phase. Build and Audit require `html`; Schema requires `schema`. Research and Publish need no body (they reuse the shared research fetch and publisher).
      properties:
        html:
          type: string
          description: HTML produced by the Replit Agent (Build / Audit phases).
        schema:
          type: string
          description: JSON-LD produced by the Replit Agent (Schema phase).
    PhasePrompt:
      type: object
      description: The copy-paste prompt text for a Replit-mode phase — the same prompt Dashboard mode sends to a model, assembled for the run.
      required:
        - phase
        - gmb
        - system
        - user
        - combined
      properties:
        phase:
          type: string
          enum:
            - build
            - audit
            - schema
          description: The phase this prompt drives.
        gmb:
          type: boolean
          description: True when the GMB (verified Google Business Profile) prompt variant was emitted; false for a No-GMB page.
        system:
          type: string
          description: The Master prompt document for the phase (may be empty).
        user:
          type: string
          description: The fully-assembled user message (context + phase instruction).
        combined:
          type: string
          description: system + user joined, ready to paste into the Replit Agent in one block.
    PhaseState:
      type: object
      required:
        - phase
        - status
      properties:
        phase:
          type: string
          enum:
            - research
            - build
            - audit
            - schema
            - publish
        status:
          type: string
          enum:
            - locked
